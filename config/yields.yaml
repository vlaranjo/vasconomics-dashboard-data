# Weekly yield-curve job (decisions 6 Nov 2026). Order = order on the page.
# France runs only when the GitHub secret FR_WEBSTAT_CLIENT_ID exists (tested live 11 Nov 2026; 3M is a monthly average, 1M and 6M are gaps).
# Italy and India come from auction results only (decisions 11 Nov 2026); Australia from RBA tables F2 and F16. China is out (terms).
schema_version: 1
countries: [us, uk, ca, jp, de, es, ch, br, fr, it, au, in]
delay_seconds: 2.0      # pause between requests (polite; about 55 a week in steady state; Italy and India read ~150 each on their first run)
max_age_days: 21        # a country whose latest observation is older than this fails validation (frozen source)
max_move_pp: 2.0        # a tenor that moved more than this many percentage points since the last published file fails
