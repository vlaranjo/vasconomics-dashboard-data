# Each index is fetched once and mapped to the pages that show it (decisions F9). All 34 pages of the old script
# (PE_Ratio_Download_from_Worldperatio.py) plus Nasdaq 100 and Dow Jones. `group` feeds the selector headings on the page.
# `first_point` is the expected first month (null = not checked).
schema_version: 1
user_agent: "vasconomics-dashboard/1.0 (personal, non-commercial; contact via vasconomics.com)"
delay_seconds: 4
