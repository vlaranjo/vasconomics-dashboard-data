# Markets job: Yahoo -> returns -> validate -> atomic swap of data/ -> one commit -> Pages deploy.
# Five runs a week-day (UTC) because GitHub starts scheduled runs hours late (5-8 h seen in Nov 2026): at least one then lands
# near its slot. Every run is safe to repeat: only COMPLETED bars are used (funds from 17:00 UTC, FX from London midnight), and
# a run whose data is not newer than what is published keeps the published data. 17:47, 19:47 and 22:37 Mon-Fri cover the
# day's close; 05:47 and 11:47 Tue-Sat repair a missed day (Friday's FX bar only completes on Saturday).
# A manual run (workflow_dispatch) on the dev branch commits to dev and does NOT deploy.
name: markets

on:
  schedule:
    - cron: "47 17 * * 1-5"   # 17:47 UTC Mon-Fri, after every European close
    - cron: "47 19 * * 1-5"   # 19:47 UTC Mon-Fri
    - cron: "37 22 * * 1-5"   # 22:37 UTC Mon-Fri, after the US close
    - cron: "47 5 * * 2-6"    # 05:47 UTC Tue-Sat, repair run for the previous day
    - cron: "47 11 * * 2-6"   # 11:47 UTC Tue-Sat, second repair run
  workflow_dispatch:

permissions:
  contents: write

# Its own group: a queued run of another workflow can never replace this one (GitHub keeps one pending run per group).
# Two jobs finishing at once are handled by jobs/commit_data.py (see decisions S4).
concurrency:
  group: markets
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0          # full history: commit_data.py reads the age of the last commit that touched data/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch, compute, validate, swap
        run: python jobs/run_markets.py
      - name: Commit data (only real changes, plus one heartbeat a day) and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python jobs/commit_data.py --job markets --message "data: markets ${GITHUB_RUN_ID}" --branch "${GITHUB_REF_NAME}"

  deploy:
    needs: publish
    if: github.ref_name == 'main' && needs.publish.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-deploy.yml
