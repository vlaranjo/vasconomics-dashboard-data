# Fixed-income characteristics (21 Nov 2026): yield to maturity, duration, average rating and OAS of the Fixed Income page's bond funds,
# from the fund issuers' own pages (State Street SPDR, Vanguard; iShares and Invesco refused automated requests and are switched off).
# Weekly: the issuers publish daily (State Street) or monthly (Vanguard) figures, so once a week is plenty. Plain requests, 5 s apart;
# a refusal stops every further request to that issuer. A run that finds the same figures commits nothing.
# TERMS: read docs/fi-characteristics.md before merging this to main (the issuers' terms restrict reuse without written permission).
# A manual run (workflow_dispatch) on the dev branch commits to dev and does NOT deploy.
name: characteristics

on:
  schedule:
    - cron: "17 7 * * 6"      # Saturday 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write

# Its own group: a queued run of another workflow can never replace this one.
concurrency:
  group: characteristics
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0          # full history: commit_data.py reads the age of the last commit that touched data/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch, validate, swap
        run: python jobs/run_characteristics.py
      - name: Commit data (only real changes) and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python jobs/commit_data.py --job characteristics --message "data: characteristics ${GITHUB_RUN_ID}" --branch "${GITHUB_REF_NAME}"

  deploy:
    needs: publish
    if: github.ref_name == 'main' && needs.publish.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-deploy.yml
