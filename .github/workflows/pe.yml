# Weekly P/E job: worldperatio.com (plain HTTP) -> validate -> atomic swap -> commit -> Pages deploy.
name: pe

on:
  schedule:
    - cron: "7 3 * * 0"       # Sunday 03:07 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch, parse, validate, swap
        run: python jobs/run_pe.py
      - name: Commit data (also the keep-alive heartbeat)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: pe ${GITHUB_RUN_ID}" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          echo "push failed three times" >&2
          exit 1

  deploy:
    needs: publish
    if: github.ref_name == 'main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-deploy.yml
