# Weekly P/E job: worldperatio.com (plain HTTP) -> validate -> atomic swap -> commit -> Pages deploy.
name: pe

on:
  schedule:
    - cron: "7 3 * * 0"       # Sunday 03:07 UTC
  workflow_dispatch:

permissions:
  contents: write

# Its own group: a queued run of another workflow can never replace this one (GitHub keeps one pending run per group).
# Two jobs finishing at once are handled by jobs/commit_data.py (see decisions S4).
concurrency:
  group: pe
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0          # full history: commit_data.py reads the age of the last commit that touched data/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch, parse, validate, swap
        run: python jobs/run_pe.py
      - name: Commit data (only real changes, plus one heartbeat a day) and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python jobs/commit_data.py --job pe --message "data: pe ${GITHUB_RUN_ID}" --branch "${GITHUB_REF_NAME}"

  deploy:
    needs: publish
    if: github.ref_name == 'main' && needs.publish.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-deploy.yml
