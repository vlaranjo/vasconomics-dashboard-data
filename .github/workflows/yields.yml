# Weekly yield-curve job: per country (config/yields.yaml `source:`) worldgovernmentbonds.com read in a headless Chromium, or
# the official source (plain HTTP) -> validate -> atomic swap -> commit -> Pages deploy.
# Monday 15:47 UTC: the SNB cube is published Mondays 14:30, so every official source carries the previous Friday's close;
# worldgovernmentbonds.com then shows Monday's quotes so far for Europe and the last close for the US and Asia.
# France runs only if the repository secret FR_WEBSTAT_CLIENT_ID (a Webstat API key, no secret half) exists; without it that country
# is skipped quietly. The secret is passed to the one step that runs the job, as an environment variable, and nowhere else.
name: yields

on:
  schedule:
    - cron: "47 15 * * 1"     # Monday 15:47 UTC
  workflow_dispatch:

permissions:
  contents: write

# Its own group: a queued run of another workflow can never replace this one (GitHub keeps one pending run per group).
# Two jobs finishing at once are handled by jobs/commit_data.py (see decisions S4).
concurrency:
  group: yields
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    timeout-minutes: 45          # the first run of Italy and India reads ~300 small files at 2 s each
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0          # full history: commit_data.py reads the age of the last commit that touched data/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Playwright's Chromium (for the wgb countries)
        run: python -m playwright install --with-deps chromium
      - name: Fetch, build curves, validate, swap
        env:
          FR_WEBSTAT_CLIENT_ID: ${{ secrets.FR_WEBSTAT_CLIENT_ID }}
        run: python jobs/run_yields.py
      - name: Commit data (only real changes, plus one heartbeat a day) and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python jobs/commit_data.py --job yields --message "data: yields ${GITHUB_RUN_ID}" --branch "${GITHUB_REF_NAME}"

  deploy:
    needs: publish
    if: github.ref_name == 'main' && needs.publish.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-deploy.yml
